# Solo responde en la red del laboratorio
listen-address=192.168.100.5,127.0.0.1
bind-interfaces

# Las consultas sin punto no salen a Internet, ni las IPs privadas
domain-needed
bogus-priv

# Dominio local: estos nombres se resuelven aquí y no se reenvían
local=/lab/
domain=lab
expand-hosts

# Lo demás se reenvía a estos servidores
no-resolv
server=1.1.1.1
server=9.9.9.9
cache-size=500

# Registros del laboratorio
host-record=winhost.lab,192.168.100.1
host-record=pve.lab,192.168.100.2
host-record=infra-lxc.lab,192.168.100.5
host-record=k3s-cp1.lab,192.168.100.10
host-record=k3s-w1.lab,192.168.100.11
host-record=k3s-w2.lab,192.168.100.12
